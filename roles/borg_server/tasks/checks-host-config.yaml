---
# tasks file for borg_server

- name: "Validate repo pool '{{ repo_pool.path }}'"
  lingfra.borg.validate_repo_pool:
    create: "{{ repo_pool.create | default(borg_server_repo_pool_create) }}"
    path: "{{ repo_pool.path }}"
  tags:
    - checks
    - checks-host-config

- name: "Include host configuration checks for repos of repo_pool '{{ repo_pool.path }}'"
  ansible.builtin.include_tasks:
    file: checks-host-config-repos.yaml
    apply:
      tags:
        - checks
        - checks-host-config
  loop: "{{ repo_pool.repos }}"
  loop_control:
    loop_var: repo
  tags:
    - checks
    - checks-host-config

# End of file
