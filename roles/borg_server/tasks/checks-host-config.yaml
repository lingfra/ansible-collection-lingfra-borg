---
# tasks file for borg_server

# ---------- Gather Information for Checks ----------

- name: "Stat of repo pool"
  ansible.builtin.stat:
    path: "{{ borg_server_repo_pool }}"
  become: true    # permissions need to check protected directories
  register: borg_server_repo_pool_result
  tags:
    - checks
    - checks-host-config

- name: "Get user database"
  ansible.builtin.getent:
    database: passwd
  tags:
    - checks
    - checks-host-config

- name: "Get group database"
  ansible.builtin.getent:
    database: group
  tags:
    - checks
    - checks-host-config

# ---------- Actual Checks ----------

- name: "Check repo pool existance"
  ansible.builtin.assert:
    that:
      - borg_server_repo_pool_create or borg_server_repo_pool_result.stat.exists
    fail_msg: |
      Repo pool folder '{{ borg_server_repo_pool }}' does not exist and should not be created.

      If it is desired that this role creates the repo pool folder, then set following variable:

        borg_server_repo_pool_create: true
    success_msg: Repo pool folder '{{ borg_server_repo_pool }}' exist.
    quiet: true
  tags:
    - checks
    - checks-host-config

- name: "Include host configuration checks for borg_server_repos"
  ansible.builtin.include_tasks:
    file: checks-host-config-repos.yaml
    apply:
      tags:
        - checks
        - checks-host-config
  loop: "{{ borg_server_repos }}"
  loop_control:
    loop_var: repo
  tags:
    - checks
    - checks-host-config

# End of file
