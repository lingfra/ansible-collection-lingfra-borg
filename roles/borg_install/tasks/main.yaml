---
# tasks file for borg_install

- name: Include OS specific variables
  ansible.builtin.include_vars: "{{lookup('ansible.builtin.first_found', params)}}"
  vars:
    params:
      files:
        - '{{ ansible_distribution }}.yaml'
        - '{{ ansible_os_family }}.yaml'
        - default.yaml
      paths:
        - 'vars'

# ---------- Configure ----------

- name: Compose package list
  ansible.builtin.set_fact:
    borg_install_pkg_list: "{{
        borg_install_pkg_list_all
        + (borg_install_add_client_pkgs | ternary(borg_install_pkg_list_client, []))
      }}"
  tags:
    - configure

- name: Install borg and dependencies
  ansible.builtin.package:
    name: "{{ borg_install_pkg_list }}"
    state: present
  become: true

# End of file
