---
# tasks file for borg_install

- name: Include OS specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_os_family }}.yaml"
        - "{{ ansible_distribution }}.yaml"
        - default.yaml
      paths:
        - "vars"

# ---------- Configure ----------

- name: Compose package list
  ansible.builtin.set_fact:
    borg_install_pkg_list: "{{
        borg_install_pkg_list_all
        + (borg_install_add_client_pkgs | ternary(borg_install_pkg_list_client, []))
      }}"
  tags:
    - configure

- name: "Include tasks install task for {{ ansible_pkg_mgr | default('generic package manager') }}"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
    apply:
      tags:
        - configure
  tags:
    - configure
  vars:
    params:
      files:
        - "pkg_{{ ansible_pkg_mgr }}.yaml"
        - "pkg_generic.yaml"
      paths:
        - "tasks"

# End of file
