---
# tasks file for borgmatic

- name: Check public role variable syntax
  ansible.builtin.assert:
    that:
      - true
      # # borgmatic_example_variable is a string
      # - borgmatic_example_variable is defined
      # - borgmatic_example_variable is not none
      # - borgmatic_example_variable is string
      # - borgmatic_example_variable | length > 0
    fail_msg: >
      Bad syntax for public role variables. Refer to the documentation and
      check your configuration.
    success_msg: Syntax is correct for public role variables.
    quiet: true
  tags:
    - checks
    - checks-syntax

