---
# tasks file for borgmatic

# Example of a check to verify the existence of the expected users and groups.

- name: Get user database
  ansible.builtin.getent:
    database: passwd
  tags:
    - checks
    - checks-host-config

- name: Get group database
  ansible.builtin.getent:
    database: group
  tags:
    - checks
    - checks-host-config

