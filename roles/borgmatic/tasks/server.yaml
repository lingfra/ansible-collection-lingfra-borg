---
# tasks file for borgmatic

- name: "Include tasks repo.yaml for {{ backup.name ~ ' on ' ~ server.hostname }}"
  ansible.builtin.include_tasks:
    file: repo.yaml
  loop: "{{ server.repos }}"
  loop_control:
    loop_var: repo
    label: "{{ repo_loop_label }}"
  vars:
    repo_loop_label: "{{ repo.location | default('N/A') ~ ' on ' ~ server.hostname ~ ' for ' ~ backup.name }}"

# End of file
