---
# argument specs file for borgmatic

argument_specs:
  main:
    short_description: Main entry point for borgmatic role
    description:
      - Longer descriptions.
      - Every list item is a new paragraph.
    options:
      borgmatic_compression:
        type: "str"
        default: "zstd"
        description:
          - "Compression to be used on the repositories."

      borgmatic_server:
        type: "dict"
        required: true
        options:
          hostname:
            type: "str"
            required: true
          repos:
            type: "list"
            elements: dict
            required: true
            options:
              location:
                type: "str"
                required: true
              removable:
                type: "bool"
                default: false
          user:
            type: "str"
            required: true

# End of file
