---
# argument specs file for borgmatic

argument_specs:
  main:
    short_description: Main entry point for borgmatic role
    description:
      - Longer descriptions.
      - Every list item is a new paragraph.
    options:
      borgmatic_compression:
        type: "str"
        default: "zstd"
        description:
          - "Compression to be used on the repositories."

      borgmatic_backups:
        type: "list"
        elements: "dict"
        required: true
        options:
          after_everything:
            type: "list"
            elements: "str"
            required: false
            description:
              - "Actions to to after all backups."
          before_everything:
            type: "list"
            elements: "str"
            required: false
            description:
              - "Actions to do before all backups."
          keep_daily:
            type: "int"
            required: false
            description:
              - "Number of daily archives to keep."
          keep_hourly:
            type: "int"
            required: false
            description:
              - "Number of hourly archives to keep."
          keep_minutely:
            type: "int"
            required: false
            description:
              - "Number of minutely archives to keep."
          keep_monthly:
            type: "int"
            required: false
            description:
              - "Number of monthly archives to keep."
          keep_secondly:
            type: "int"
            required: false
            description:
              - "Number of secondly archives to keep."
          keep_weekly:
            type: "int"
            required: false
            description:
              - "Number of weekly archives to keep."
          keep_within:
            type: "str"
            required: false
            description:
              - "Keep all archives within this time interval."
          keep_yearly:
            type: "int"
            required: false
            description:
              - "Number of yearly archives to keep."
          mariadb_databases:
            type: "list"
            elements: "dict"
            required: false
            description:
              - "MariaDB databases to backup."
          mongodb_databases:
            type: "list"
            elements: "dict"
            required: false
            description:
              - "MongoDB databases to backup."
          mysql_databases:
            type: "list"
            elements: "dict"
            required: false
            description:
              - "MySQL databases to backup."
          name:
            type: "str"
            required: true
          passphrase:
            type: "str"
            required: false
          skip_actions:
            type: "list"
            elements: "str"
            choices:
              - "init"
              - "compact"
              - "create"
              - "prune"
              - "check"
            required: false
            description:
              - "List of one or more actions to skip."
          postgresql_databases:
            type: "list"
            elements: "dict"
            required: false
            description:
              - "PostgreSQL databases to backup."
          source_directories:
            type: "list"
            elements: "str"
            required: true
          servers:
            type: "list"
            elements: "dict"
            options:
              hostname:
                type: "str"
                required: true
              repos:
                type: "list"
                elements: dict
                required: true
                options:
                  init:
                    type: "bool"
                    default: false
                  location:
                    type: "str"
                    required: true
                  removable:
                    type: "bool"
                    default: false
              user:
                type: "str"
                required: true
          sqlite_databases:
            type: "list"
            elements: "dict"
            required: false
            description:
              - "SQLite databases to backup."

# End of file
