---

# Molecule scenario for borgmatic with vagrant driver.

# ---------- Borgmatic Configuration ----------

- name: "Import borgmatic playbook"
  ansible.builtin.import_playbook: lingfra.borg.borgmatic
  vars:
    borgmatic_backups:
      - name: app1
        source_directories:
          - /etc
          - /root
        exclude_patterns:
          - /etc/passwd
          - "'/etc/d*'"
        passphrase: Super-Secret-Passphras3!
        keep_daily: 14
        keep_weekly: 12
        keep_monthly: 24
        skip_actions:
          - prune
        repos:
          - hostname: borg-borgmatic-server01
            user: "backup-app1"
            path: "/srv/backup/app1"
            init: true
            removable: false
          - path: "/media/backup/app1"
            init: true
            removable: true
        systemd_service_options_override:
          ReadWritePaths: "/media/backup/app1"
      - name: app2
        source_directories:
          - /etc
          - /root
        exclude_patterns:
          - /etc/passwd
          - "'/etc/d*'"
        passphrase: Another-Secret-Passphras3!
        repos:
          - hostname: borg-borgmatic-server01
            user: "backup-app2"
            path: "/srv/backup/app2"
            init: true
            removable: false
          - hostname: borg-borgmatic-server02
            user: "backup-app2"
            path: "/srv/backup/app2"
            init: true
            removable: false
        before_actions:
          - echo before_actions 1
          - echo before_actions 2
        before_backup:
          - echo before_backup 1
          - echo before_backup 2
        before_prune:
          - echo before_prune 1
          - echo before_prune 2
        before_compact:
          - echo before_compact 1
          - echo before_compact 2
        before_check:
          - echo before_check 1
          - echo before_check 2
        before_extract:
          - echo before_extract 1
          - echo before_extract 2
        after_actions:
          - echo after_actions 1
          - echo after_actions 2
        after_backup:
          - echo after_backup 1
          - echo after_backup 2
        after_prune:
          - echo after_prune 1
          - echo after_prune 2
        after_compact:
          - echo after_compact 1
          - echo after_compact 2
        after_check:
          - echo after_check 1
          - echo after_check 2
        after_extract:
          - echo after_extract 1
          - echo after_extract 2
        match_archives: "'*'"
        on_error:
          - echo on_error 1
          - echo on_error 2
    target:
      - borg-borgmatic-client
